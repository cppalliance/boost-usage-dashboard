<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boost Library Usage Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }

        h1 {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .version-list {
            display: grid;
            gap: 20px;
            margin-top: 40px;
        }

        .version-card {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: #2d3748;
            transition: all 0.3s ease;
            display: block;
            position: relative;
        }

        .version-card:hover {
            border-color: #667eea;
            background: #edf2f7;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .version-card.latest {
            border-color: #48bb78;
            background: linear-gradient(135deg, #f0fff4 0%, #c6f6d5 100%);
        }

        .version-card.latest:hover {
            border-color: #38a169;
            box-shadow: 0 8px 20px rgba(72, 187, 120, 0.3);
        }

        .version-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .version-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
        }

        .version-badge {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .version-badge.latest {
            background: #48bb78;
        }

        .version-description {
            color: #718096;
            font-size: 0.95rem;
            text-align: left;
            margin-top: 8px;
        }

        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
            color: #a0aec0;
            font-size: 0.9rem;
        }

        .version-card.develop,
        .version-card.develop:hover {
            border-color: #f6ad55;
            background: linear-gradient(135deg, #fffaf0 0%, #feebc8 100%);
        }

        .version-badge.develop {
            background: #ed8936;
        }

        .status-message {
            color: #718096;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .version-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Boost Library Usage Analysis</h1>
        <p class="subtitle">Comprehensive analysis and statistics of Boost C++ Library usage across GitHub repositories</p>

        <div class="version-list" id="versionList">
            <!-- Versions will be dynamically loaded here -->
            <div class="status-message">Loading versions...</div>
        </div>

        <div class="footer">
            <p>Select a Boost version to view its usage analysis dashboard</p>
        </div>
    </div>

    <script>
        // Show the version folders listed in versions.json. boost-release.yml writes that
        // file next to this page, so the list always comes from the repository that serves it.
        const DEVELOP_DESCRIPTION = 'View the latest unreleased development statistics. This will become the next official release.';

        function compareVersionsDescending(a, b) {
            const versionA = a.replace('v', '').split('.').map(Number);
            const versionB = b.replace('v', '').split('.').map(Number);

            for (let i = 0; i < Math.max(versionA.length, versionB.length); i++) {
                const numA = versionA[i] || 0;
                const numB = versionB[i] || 0;
                if (numA !== numB) {
                    return numB - numA;  // Descending order
                }
            }
            return 0;
        }

        function buildCard(options) {
            const card = document.createElement('a');
            card.href = options.href;
            card.className = 'version-card' + (options.cardClass ? ' ' + options.cardClass : '');

            const header = document.createElement('div');
            header.className = 'version-header';

            const number = document.createElement('span');
            number.className = 'version-number';
            number.textContent = options.title;
            header.appendChild(number);

            if (options.badge) {
                const badge = document.createElement('span');
                badge.className = 'version-badge' + (options.badgeClass ? ' ' + options.badgeClass : '');
                badge.textContent = options.badge;
                header.appendChild(badge);
            }

            const description = document.createElement('div');
            description.className = 'version-description';
            description.textContent = options.description;

            card.appendChild(header);
            card.appendChild(description);
            return card;
        }

        function showMessage(container, text, linkHref, linkText) {
            const message = document.createElement('div');
            message.className = 'status-message';
            message.appendChild(document.createTextNode(text));
            if (linkHref) {
                message.appendChild(document.createTextNode(' '));
                const link = document.createElement('a');
                link.href = linkHref;
                link.textContent = linkText;
                message.appendChild(link);
            }
            container.textContent = '';
            container.appendChild(message);
        }

        async function loadVersions() {
            const versionList = document.getElementById('versionList');

            try {
                const response = await fetch('versions.json', { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error('versions.json returned HTTP ' + response.status);
                }

                const data = await response.json();
                const hasDevelop = data.develop === true;
                const versions = (Array.isArray(data.versions) ? data.versions : [])
                    .filter(name => typeof name === 'string' && /^v\d+\.\d+$/.test(name))
                    .sort(compareVersionsDescending);

                if (versions.length === 0 && !hasDevelop) {
                    showMessage(versionList, 'No versions found');
                    return;
                }

                const cards = [];

                // Development (unreleased) version first
                if (hasDevelop) {
                    cards.push(buildCard({
                        href: 'develop/index.html',
                        cardClass: 'develop',
                        title: 'Development Version',
                        badge: 'In Progress',
                        badgeClass: 'develop',
                        description: DEVELOP_DESCRIPTION
                    }));
                }

                // Released versions, newest first; the newest is the latest release
                versions.forEach((version, index) => {
                    const isLatest = index === 0;
                    const versionNumber = version.replace('v', '');
                    cards.push(buildCard({
                        href: version + '/index.html',
                        cardClass: isLatest ? 'latest' : '',
                        title: 'Boost ' + versionNumber,
                        badge: isLatest ? 'Latest Release' : '',
                        badgeClass: isLatest ? 'latest' : '',
                        description: 'View usage statistics, library popularity, repository analysis, and BSL-1.0 license adoption for Boost ' + versionNumber + '.'
                    }));
                });

                versionList.textContent = '';
                cards.forEach(card => versionList.appendChild(card));

            } catch (error) {
                console.error('Error loading versions:', error);
                showMessage(versionList, 'The list of versions could not be loaded.', 'develop/index.html', 'Open the development dashboard');
            }
        }

        // Load versions when page loads
        document.addEventListener('DOMContentLoaded', loadVersions);

        // Auto-redirect to latest version (optional - comment out if you want users to choose)
        // Uncomment the following lines to enable auto-redirect:
        /*
        window.addEventListener('load', () => {
            const currentPath = window.location.pathname;
            if (currentPath === '/' || currentPath.endsWith('/index.html')) {
                const pathParts = currentPath.split('/').filter(p => p);
                if (pathParts.length === 0 || (pathParts.length === 1 && pathParts[0] === 'index.html')) {
                    // Wait a moment to let versions load, then redirect to the first one
                    setTimeout(() => {
                        const firstLink = document.querySelector('.version-card');
                        if (firstLink) {
                            window.location.href = firstLink.getAttribute('href');
                        }
                    }, 500);
                }
            }
        });
        */
    </script>
</body>
</html>
