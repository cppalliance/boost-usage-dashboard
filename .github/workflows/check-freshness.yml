name: Check dashboard freshness

# The daily publisher pushes new artifacts to develop/ and deploy.yml pulls them
# onto the server. If either half stops, this run goes red within a day instead
# of the dashboard going stale unnoticed.
#
# Set the repository variable LIVE_URL to the public base of this repository's
# site, without a trailing slash, for example https://insights.cppalliance.org/boost
# The file is identical in every repository; only the variable differs.

on:
  schedule:
    # After the daily Boost release sync (05:00 UTC) and the publisher window.
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  MAX_AGE_HOURS: '72'

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Newest develop/ commit is recent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last=$(gh api "repos/${REPO}/commits?path=develop&per_page=1" --jq '.[0].commit.committer.date // empty')
          if [ -z "${last}" ]; then
            echo "::error title=No dashboard commit::No commit touches develop/ in ${REPO}."
            exit 1
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "${last}" +%s) ) / 3600 ))
          echo "Newest commit touching develop/: ${last} (${age_h} h ago, limit ${MAX_AGE_HOURS} h)"
          if [ "${age_h}" -gt "${MAX_AGE_HOURS}" ]; then
            echo "::error title=Dashboard feed is stale::develop/ in ${REPO} was last updated ${age_h} hours ago (limit ${MAX_AGE_HOURS}). The publisher is not pushing."
            exit 1
          fi

      - name: Live host serves a recent develop/
        if: ${{ !cancelled() }}
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${LIVE_URL:-}" ]; then
            echo "::warning title=LIVE_URL not set::Set the repository variable LIVE_URL to enable the live-host check."
            exit 0
          fi
          url="${LIVE_URL%/}/develop/index.html"
          modified=$(curl -fsSI --max-time 20 --retry 2 "${url}" | tr -d '\r' | awk -F': ' 'tolower($1)=="last-modified" { print $2 }')
          if [ -z "${modified}" ]; then
            echo "::error title=Live host check failed::${url} did not return a Last-Modified header."
            exit 1
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "${modified}" +%s) ) / 3600 ))
          echo "${url} last modified: ${modified} (${age_h} h ago, limit ${MAX_AGE_HOURS} h)"
          if [ "${age_h}" -gt "${MAX_AGE_HOURS}" ]; then
            echo "::error title=Live dashboard is stale::${url} was last modified ${age_h} hours ago (limit ${MAX_AGE_HOURS}). The server is not pulling new commits."
            exit 1
          fi
